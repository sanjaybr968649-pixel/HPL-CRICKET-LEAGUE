<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050a12">
  <meta name="description" content="HPL Season 11 — premium Hand Cricket Premier League dashboard, matches, teams, players and all-time records.">
  <title>HPL Season 11 | Hand Cricket Premier League</title>
  <link rel="preload" as="image" href="assets/hpl-opening.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="opening" class="opening" aria-label="HPL opening screen">
    <div class="opening-bg"></div>
    <div class="opening-shade"></div>
    <div class="opening-content">
      <div class="loading-label">LOADING <span id="loadingPercent">0%</span></div>
      <div class="loading-track"><span id="loadingBar"></span></div>
      <button id="openHpl" class="open-button" type="button" disabled>TAP TO OPEN</button>
    </div>
  </div>

  <div id="app" class="app-shell is-hidden"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
