<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HPL Admin</title><link rel="stylesheet" href="styles.css"><style>body{padding:25px}.adminWrap{max-width:1100px;margin:auto}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form input,.form select,.form textarea{width:100%;padding:12px;background:#091a11;color:#fff;border:1px solid #294536;border-radius:10px}.form textarea{min-height:100px}.full{grid-column:1/-1}.panel{padding:22px;border:1px solid #294536;border-radius:20px;background:#0b1b13;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.danger{border-color:#9b4747;background:#341515;color:#fff}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid #243c2f;border-radius:10px;background:#0d2117}.hiddenA{display:none}@media(max-width:700px){.form{grid-template-columns:1fr}}</style></head><body><div class=adminWrap><p class=eyebrow>HPL ADMIN PANEL</p><h1>Season 11 Control Centre</h1><div id=login class=panel><h2>Admin Login</h2><div class=form><input id=email placeholder=Email><input id=password type=password placeholder=Password></div><button class=btn id=loginBtn>Login</button><p id=loginMsg></p></div><div id=admin class="hiddenA"><div class=panel><div class=row><button class=btn onclick="showTab('match')">Add / Update Match</button><button class=btn onclick="showTab('player')">Add / Update Player</button><button class=btn onclick="showTab('points')">Points Table</button><button class="btn danger" id=logout>Logout</button></div></div><div id=matchTab class=panel><h2>Match</h2><form id=matchForm class=form><input id=matchId placeholder="Match ID e.g. M25"><select id=team1><option>Royal Kings</option><option>Chasers</option><option>Titans</option><option>Stars</option></select><select id=team2><option>Chasers</option><option>Royal Kings</option><option>Titans</option><option>Stars</option></select><input id=date type=date><input id=time type=time><select id=status><option>Upcoming</option><option>Completed</option><option>Postponed</option><option>Cancelled</option></select><input id=score1 placeholder="Team 1 score"><input id=score2 placeholder="Team 2 score"><select id=winner><option value="">No winner</option><option>Royal Kings</option><option>Chasers</option><option>Titans</option><option>Stars</option></select><input id=resultText class=full placeholder="Result text"><input id=resultImage class=full placeholder="Result image URL (optional)"><label class=full>Or upload result image <input id=imageFile type=file accept=image/*></label><button class="btn full" type=submit>Save Match to Firebase</button></form><p id=matchMsg></p><div id=matchList class=list></div></div><div id=playerTab class="panel hiddenA"><h2>Player</h2><form id=playerForm class=form><input id=playerId placeholder="Player ID"><input id=pname placeholder="Name"><input id=fullName placeholder="Full name"><input id=role placeholder="Role"><input id=place placeholder="Place"><input id=photo placeholder="Photo URL"><input id=runs type=number placeholder="Season 11 runs"><input id=wickets type=number placeholder="Season 11 wickets"><input id=careerRuns type=number placeholder="Career runs"><input id=careerMatches type=number placeholder="Career matches"><input id=careerWickets type=number placeholder="Career wickets"><input id=iplRuns type=number min=0 placeholder="IPL career runs (verified)"><textarea id=international class=full placeholder="International / professional career details (ODI, T20I, IPL, etc.)"></textarea><button class="btn full" type=submit>Save Player</button></form><p id=playerMsg></p></div><div id=pointsTab class="panel hiddenA"><h2>Points Table</h2><form id=pointsForm class=form><input id=ptTeam placeholder=Team><input id=ptPlayed type=number placeholder=Played><input id=ptWins type=number placeholder=Wins><input id=ptLosses type=number placeholder=Losses><input id=ptPoints type=number placeholder=Points><button class="btn full" type=submit>Save Points</button></form><div id=pointsList class=list></div></div></div></div><script type=module src=admin.js></script></body></html>
