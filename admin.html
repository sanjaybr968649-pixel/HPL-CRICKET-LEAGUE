<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPL Season 11 - Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginScreen" class="screen">
    <div class="login-box">
      <div class="logo">🏏</div>
      <h1>HPL Admin</h1>
      <p>Hand Cricket Premier League — Season 11</p>
      <input id="email" type="email" placeholder="Admin Email">
      <input id="password" type="password" placeholder="Password">
      <button id="loginBtn">LOGIN</button>
      <p id="loginMsg"></p>
    </div>
  </div>

  <div id="adminScreen" class="hidden">
    <header>
      <div>
        <h1>HPL Season 11</h1>
        <p>Admin Panel</p>
      </div>
      <button id="logoutBtn" class="danger">Logout</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-page="dashboardPage">Dashboard</button>
      <button class="tab" data-page="teamsPage">Teams</button>
      <button class="tab" data-page="playersPage">Players</button>
      <button class="tab" data-page="matchesPage">Matches</button>
      <button class="tab" data-page="pointsPage">Points Table</button>
      <button class="tab" data-page="scorecardsPage">Scorecards</button>
    </nav>

    <main>
      <section id="dashboardPage" class="page active">
        <h2>Dashboard</h2>
        <div class="cards">
          <div class="card"><span>Teams</span><strong id="teamCount">0</strong></div>
          <div class="card"><span>Players</span><strong id="playerCount">0</strong></div>
          <div class="card"><span>Matches</span><strong id="matchCount">0</strong></div>
          <div class="card"><span>Points Entries</span><strong id="pointCount">0</strong></div>
        </div>
        <div class="panel">
          <button id="loadBtn">LOAD DATA</button>
          <button id="saveBtn">SAVE DATA</button>
          <p id="status"></p>
        </div>
      </section>

      <section id="teamsPage" class="page">
        <h2>Teams</h2>
        <div class="panel">
          <input id="teamName" placeholder="Team name">
          <input id="teamLogo" placeholder="Logo file/path">
          <input id="teamCaptain" placeholder="Captain">
          <input id="teamGround" placeholder="Home ground">
          <button id="addTeamBtn">ADD TEAM</button>
        </div>
        <div id="teamsList"></div>
      </section>

      <section id="playersPage" class="page">
        <h2>Players</h2>
        <div class="panel grid">
          <input id="playerName" placeholder="Player name">
          <input id="playerShort" placeholder="Short name">
          <input id="playerTeam" placeholder="Team">
          <input id="playerPlace" placeholder="Place">
          <input id="playerRole" placeholder="Role">
          <input id="playerBatting" placeholder="Batting">
          <input id="playerBowling" placeholder="Bowling">
          <input id="playerJersey" placeholder="Jersey number">
          <button id="addPlayerBtn">ADD PLAYER</button>
        </div>
        <div id="playersList"></div>
      </section>

      <section id="matchesPage" class="page">
        <h2>Matches</h2>
        <div class="panel grid">
          <input id="matchId" placeholder="Match ID (e.g. Match 8)">
          <input id="matchHome" placeholder="Home team">
          <input id="matchAway" placeholder="Away team">
          <input id="matchHomeScore" type="number" placeholder="Home score">
          <input id="matchAwayScore" type="number" placeholder="Away score">
          <input id="matchHomeWickets" type="number" placeholder="Home wickets">
          <input id="matchAwayWickets" type="number" placeholder="Away wickets">
          <input id="matchResult" placeholder="Result">
          <input id="matchGround" placeholder="Ground">
          <textarea id="matchPerformance" placeholder='Player performance JSON. Example: [{"name":"Sanjay","runs":137,"wickets":0,"notOut":false}]'></textarea>
          <button id="addMatchBtn">ADD / UPDATE MATCH</button>
        </div>
        <div id="matchesList"></div>
      </section>

      <section id="pointsPage" class="page">
        <h2>Points Table</h2>
        <div class="panel grid">
          <input id="pointTeam" placeholder="Team">
          <input id="pointPlayed" type="number" placeholder="Played">
          <input id="pointWon" type="number" placeholder="Won">
          <input id="pointLost" type="number" placeholder="Lost">
          <input id="pointPoints" type="number" placeholder="Points">
          <button id="addPointBtn">ADD / UPDATE POINTS</button>
        </div>
        <div id="pointsList"></div>
      </section>

      <section id="scorecardsPage" class="page">
        <h2>Scorecards</h2>
        <div class="panel">
          <textarea id="scorecardJSON" placeholder='Scorecard JSON'></textarea>
          <button id="saveScorecardBtn">SAVE SCORECARD</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
